<!-- Ikon aplikasi untuk layar utama ponsel (maskable).
     Latarnya penuh warna merek dan gambarnya diperkecil ke sekitar 60% kotak:
     Android memotong ikon jadi lingkaran, oval, atau kotak membulat sesuai peluncur
     masing-masing, dan apa pun di luar lingkaran aman 80% itu bisa terpotong. -->
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" fill="none">
  <rect width="192" height="192" fill="#3B35D1"/>
  <g transform="translate(38.4 38.4) scale(2.88)">
    <path d="M10.2 29 L20.2 6.6" stroke="#C7C5F5" stroke-width="5.6" stroke-linecap="round"/>
    <path d="M20.2 6.6 L24.9 13.1" stroke="#9D99EC" stroke-width="5.2" stroke-linecap="round"/>
    <path d="M16.8 21.2 C22.4 18.6 27.4 21.4 29.6 29" stroke="#A5D8DE" stroke-width="5.4" stroke-linecap="round"/>
    <circle cx="24.6" cy="16.4" r="3.1" fill="#FFFFFF"/>
  </g>
</svg>
