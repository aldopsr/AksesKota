<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="AksesKota: cek akses fasilitas publik sebelum berkunjung." />
    <!-- Warna bar status mengikuti warna paling atas halaman (header putih), bukan warna merek. -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AksesKota</title>
    <!-- Pratinjau saat tautannya dibagikan di WhatsApp, X, atau Slack. Tanpa ini yang
         muncul hanya URL telanjang — dan tautan ini memang dibagikan, itu caranya
         orang saling memberi tahu sebuah tempat bisa diakses atau tidak. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AksesKota" />
    <meta property="og:title" content="AksesKota — cek akses sebelum berangkat" />
    <meta property="og:description" content="Peta aksesibilitas fasilitas publik: tiap tempat dicocokkan dengan kebutuhan Anda, bukan satu angka untuk semua orang." />
    <meta property="og:url" content="https://akses-kota.vercel.app/" />
    <meta property="og:image" content="https://akses-kota.vercel.app/logo-akseskota.jpg" />
    <meta property="og:locale" content="id_ID" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Dipasang ke layar utama ponsel (PWA). Tidak ada service worker: tanpa
         jaringan aplikasi ini memang tidak bisa apa-apa (peta, rute, dan data
         semuanya dari server), jadi cache offline cuma menambah risiko versi
         basi tanpa menambah guna. Manifest saja sudah cukup agar bisa di-install. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS mengabaikan manifest: ikon dan mode layar penuhnya diatur di sini,
         dan apple-touch-icon tidak menerima SVG, jadi tetap pakai JPG. -->
    <link rel="apple-touch-icon" href="/logo-akseskota.jpg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AksesKota" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font:16px/1.5 system-ui;max-width:40rem;margin:4rem auto;padding:0 1rem">
        AksesKota membutuhkan JavaScript untuk menampilkan peta dan menghitung rute.
        Mohon aktifkan JavaScript di peramban Anda, lalu muat ulang halaman ini.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
